name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  test-groups:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_API_KEY: ${{ secrets.BATON_API_KEY }}
      BATON_ORG_ID: ${{ secrets.BATON_ORG_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-jumpcloud
        run: go build ./cmd/baton-jumpcloud
      - name: Install baton CLI from baton-sdk (conductorone/baton is archived)
        run: |
          set -euxo pipefail
          BATON_VERSION=v0.11.0
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          if [ "${ARCH}" = "x86_64" ]; then ARCH="amd64"; fi
          FILENAME="baton-${BATON_VERSION}-${OS}-${ARCH}.tar.gz"
          curl -fsSL -O "https://github.com/conductorone/baton-sdk/releases/download/${BATON_VERSION}/${FILENAME}"
          tar xzf "${FILENAME}"
          mv baton /usr/local/bin/baton
          baton --version
      - name: Grant/revoke group test
        uses: ConductorOne/github-workflows/actions/sync-test@v2
        with:
          connector: ./baton-jumpcloud
          baton-entitlement: "${{ vars.TEST_GROUP_ENTITLEMENT }}"
          baton-principal: "${{ vars.TEST_GROUP_PRINCIPAL }}"
          baton-principal-type: "${{ vars.TEST_GROUP_PRINCIPAL_TYPE }}"
